<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARCH · Set a new password</title>
<style>
  :root { --bg: #0a0a0a; --fg: #f2ede6; --muted: #a39d95; --accent: #c9a84c; --err: #e07a6a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--fg); font: 16px/1.5 Georgia, "Times New Roman", serif; padding: 16px; }
  main { width: 100%; max-width: 380px; }
  .label { font: 600 11px/1 system-ui, sans-serif; letter-spacing: .2em; color: var(--accent); margin-bottom: 14px; }
  h1 { font-weight: normal; font-size: 28px; margin: 0 0 24px; }
  label { display: block; font: 12px/1 system-ui, sans-serif; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; }
  input { width: 100%; padding: 12px; background: transparent; color: var(--fg); border: 1px solid #3a3733;
          border-radius: 2px; font: 16px system-ui, sans-serif; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; margin-top: 28px; padding: 14px; background: var(--accent); color: #0a0a0a; border: 0;
           font: 600 12px/1 system-ui, sans-serif; letter-spacing: .2em; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 18px; font: 14px/1.4 system-ui, sans-serif; min-height: 1.4em; }
  .err { color: var(--err); }
</style>
</head>
<body>
<main>
  <div class="label">ARCH</div>
  <h1 id="title">Set a new password.</h1>
  <form id="f">
    <label for="p1">NEW PASSWORD</label>
    <input id="p1" type="password" autocomplete="new-password" required>
    <label for="p2">CONFIRM PASSWORD</label>
    <input id="p2" type="password" autocomplete="new-password" required>
    <button id="b" type="submit">SAVE PASSWORD</button>
  </form>
  <div id="msg" role="status"></div>
</main>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const form = document.getElementById("f"), msg = document.getElementById("msg"), btn = document.getElementById("b");
  function show(text, isErr) { msg.textContent = text; msg.className = isErr ? "err" : ""; }
  if (!token) { form.hidden = true; show("This reset link is incomplete. Ask for a new one in the app.", true); }
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
    if (p1 !== p2) { show("Passwords do not match.", true); return; }
    btn.disabled = true; show("");
    try {
      const r = await fetch("/v1/auth/password/reset", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: p1, confirm_password: p2 }) });
      const body = await r.json().catch(() => ({}));
      if (r.ok) {
        form.hidden = true;
        document.getElementById("title").textContent = "Password saved.";
        show("Open ARCH and sign in with your new password.");
      } else {
        const issues = (body.details || []).map(d => d.issue).join(" ");
        show(issues || body.detail || "Something went wrong. Please try again.", true);
        btn.disabled = false;
      }
    } catch (_) { show("No connection. Please try again.", true); btn.disabled = false; }
  });
</script>
</body>
</html>
